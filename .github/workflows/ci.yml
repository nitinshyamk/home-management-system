name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # mise.toml pins every tool, so CI runs the same golangci-lint, gofumpt,
      # and sqlc a developer does. A version drift between the two is a gate
      # that passes here and fails there, or worse, the other way round.
      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # format:check, lint (archlint + golangci-lint + vet), build, test, and
      # the generated-file staleness check. The same task `mise run pre-commit`
      # is a subset of, so a green hook means a green build.
      - run: mise run ci
