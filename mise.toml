# The single entry point for working on this project. Every gate a reviewer,
# a hook, or CI runs is a task here, so all three run the same thing.

[tools]
go = "1.25"
golangci-lint = "latest"
gofumpt = "latest"

# Pinned, unlike the rest. sqlc stamps its version into every generated file,
# so `verify-generate` reads a floating sqlc as "the committed output is
# stale" the day a new one ships -- a red build caused by nothing anybody did.
# Bump this deliberately and commit the regenerated files with it.
sqlc = "1.31.1"

[tasks.build]
description = "Compile hms, hmsdev and seed into bin/"
run = [
  "go build -o bin/hms ./cmd/hms",
  "go build -o bin/hmsdev ./cmd/hmsdev",
  "go build -o bin/seed ./cmd/seed",
]

# hms is a program somebody uses, not only one this repository builds. Typing
# `hms` in any directory is the whole point of it, so putting it on PATH is a
# task here rather than a paragraph in the README telling you to copy a file.
#
# $HMS_INSTALL_DIR, defaulting to ~/.local/bin, because that is the directory
# a user's own binaries go in and it is already on PATH on most systems. If it
# is not on this one, the task says so -- an install that appears to succeed and
# leaves `hms: command not found` is worse than one that refuses.
#
# hmsdev is deliberately NOT installed. It is the test rig; it belongs to the
# checkout, and `mise run render` is how it is reached.
[tasks.install]
description = "Build hms and put it on PATH (HMS_INSTALL_DIR, default ~/.local/bin)"
run = '''
dir="${HMS_INSTALL_DIR:-$HOME/.local/bin}"
mkdir -p "$dir"
go build -o "$dir/hms" ./cmd/hms
echo "installed $dir/hms"

case ":$PATH:" in
  *":$dir:"*) ;;
  *)
    echo
    echo "$dir is not on your PATH. Add this to your shell profile:"
    echo "    export PATH=\"$dir:\$PATH\""
    ;;
esac
'''

[tasks.uninstall]
description = "Remove the installed hms"
run = '''
dir="${HMS_INSTALL_DIR:-$HOME/.local/bin}"
if [ -e "$dir/hms" ]; then
  rm "$dir/hms"
  echo "removed $dir/hms"
else
  echo "nothing installed at $dir/hms"
fi
'''

[tasks.run]
description = "Run hms from source (mise run run -- info)"
run = "go run ./cmd/hms"

# The test rig. These were flags on hms until they were not: replaying a script
# into frames, printing the contract, and binding a plan without a terminal are
# things you do TO hms while working on it, and none of them belong on the
# command line somebody types at their own house.

[tasks.render]
description = "Replay a .keys script and print each frame (mise run render -- script.keys)"
run = "go run ./cmd/hmsdev render"

[tasks.schema]
description = "Print the agent contract (mise run schema -- --format json)"
run = "go run ./cmd/hmsdev schema"

[tasks.plan]
description = "Bind a plan and print it as JSON, without a terminal (mise run plan -- file.csv)"
run = "go run ./cmd/hmsdev plan"

[tasks.test]
description = "Run every test"
run = "go test ./..."

# Re-capturing a golden is not part of running the tests, and it has its own
# task so that it cannot be reached by adding a flag to one.
#
# A golden means UNCHANGED, and it is worth something only because the layout
# it holds was reviewed by a person and accepted. So this is the deliberate
# second step after that review -- never something a failing run does for
# itself, which would be an elaborate way of asserting nothing.
[tasks.golden]
description = "Re-capture the golden frames -- only after a screen has been signed off"
run = "go test ./internal/tui/testing -run TestGolden -update-golden"

[tasks.format]
description = "Format all Go source with gofumpt"
run = "gofumpt -w ."

[tasks."format:check"]
description = "Fail if any Go source is unformatted"
run = '''
unformatted="$(gofumpt -l .)"
if [ -n "$unformatted" ]; then
  echo "These files need formatting (run 'mise run format'):"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks."lint:arch"]
description = "Enforce the architectural boundaries (plan 1.1)"
run = "./scripts/archlint.sh"

[tasks."lint:go"]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.lint]
description = "Every lint: architecture, golangci-lint, go vet"
depends = ["lint:arch", "lint:go", "vet"]

[tasks.generate]
description = "Regenerate sqlc output and anything behind go:generate"
run = '''
if ls internal/db/queries/*.sql >/dev/null 2>&1; then
  sqlc generate
else
  echo "sqlc: no query files - skipping"
fi
go generate ./...
'''

# The generated registry only closes the exhaustiveness hole if generation
# actually runs. Without this, adding an event type and forgetting to
# regenerate leaves a stale registry that hides it -- the very gap the
# generator exists to prevent.
#
# Uses git status rather than git diff: diff does not report UNTRACKED files,
# so a newly generated file that was never committed would slip through.
[tasks."verify-generate"]
description = "Fail if generated files are stale or uncommitted"
depends = ["generate"]
run = '''
dirty="$(git status --porcelain -- '*_gen.go' internal/db/sqlc internal/db/probe)"
if [ -n "$dirty" ]; then
  echo "generated files are stale or uncommitted - run 'mise run generate' and commit:" >&2
  echo "$dirty" >&2
  exit 1
fi
echo "generated files are up to date"
'''

[tasks.seed]
description = "Build a sample house through the real write paths"
run = "go run ./cmd/seed"

# Separate from seed, and explicit, because the configured database may be a
# real one and deleting it is not a thing to do as a side effect.
[tasks.reseed]
description = "Throw the sample house away and build it again"
run = "go run ./cmd/seed --reset"

[tasks.verify]
description = "Run the integrity check against the configured database"
run = "go run ./cmd/hms verify"

[tasks.deps]
description = "Tidy the module"
run = "go mod tidy"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/"

[tasks.setup]
description = "Full build from a clean checkout"
depends = ["deps", "generate", "build"]

[tasks.hooks]
description = "Install the git pre-commit hook that runs the pre-commit gate"
run = "mise generate git-pre-commit --task=pre-commit --write"

[tasks."pre-commit"]
description = "Verification gate: format check, lint, build, test"
depends = ["format:check", "lint", "build", "test"]

# Everything pre-commit runs, plus the staleness check that only makes sense
# where the tree is expected to be committed.
[tasks.ci]
description = "What CI runs"
depends = ["format:check", "lint", "build", "test", "verify-generate"]
