version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign
  settings:
    errcheck:
      # A CLI that cannot write to its own stdout has already lost, and a
      # deferred Close on a handle nobody will read again has no error a caller
      # could act on. Checking either would bury the code that matters.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
    staticcheck:
      # golangci-lint's default set, minus one check.
      #
      # S1016 wants a struct conversion wherever two types line up field for
      # field. The request types and the command types here are separate on
      # purpose -- one is what a caller asked for, the other is what gets
      # written -- and a conversion would silently start copying any field
      # added to both, which is exactly the coupling keeping them apart avoids.
      checks:
        - all
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-S1016"
        # QF1001 rewrites !(a < b && b < c) into its De Morgan twin. "not
        # ascending" is what the code means and what it says.
        - "-QF1001"
        # QF1008 drops the embedded type from a selector. naming{Namer} exists
        # precisely to guard a nil Namer, and n.Namer.Label says which one is
        # being called.
        - "-QF1008"
    gocritic:
      disabled-checks:
        # A one-case switch is a switch with room for the second word, and an
        # if-else chain over unrelated conditions is not a switch pretending
        # otherwise. Both are shapes chosen on purpose here.
        - singleCaseSwitch
        - ifElseChain
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # sqlc writes this package; its shape is not ours to lint.
      - path: internal/db/(sqlc|probe)/
        linters:
          - gocritic
          - revive
          - staticcheck

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      # Without this, gofumpt cannot tell "home-management-system/internal/db"
      # from a standard library path and collapses the import groups -- so
      # `golangci-lint fmt` would undo exactly what `mise run format` does.
      module-path: home-management-system
